[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-creator-factory"
version = "0.2.0"
description = "A provider-neutral personal book-video production template."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "AI Creator Factory" }]
dependencies = []

[project.optional-dependencies]
ssh = ["paramiko>=3.4,<4"]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
